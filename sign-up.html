<!-- @format -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
			integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
			integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
			crossorigin="anonymous"
		></script>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="form.css" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
		/>
		<link rel="stylesheet" href="./form.css" />
		<title>Sign Up</title>
	</head>
	<body class="d-flex justify-content-center align-items-center">
		<div class="container p-3 p-md-5">
			<div class="fst-italic d-flex align-items-center gap-2 web-logo">
				<a href="./index.html"><span class="h3 fst-italic">Hire</span></a>
				<div class="call-out text-light text-center px-1"><h3>me</h3></div>
			</div>
			<h1 class="text-center mb-3 mt-5 mt-md-0">Sign Up</h1>

			<form action="./form-processed.html" method="post">
				<div class="row">
					<div class="mb-3 col">
						<label for="first-name" class="form-label">First Name</label>
						<input
							type="text"
							class="form-control"
							id="first-name"
							placeholder="Surname"
							required
						/>
					</div>
					<div class="mb-3 col">
						<label for="last-name" class="form-label">Last Name</label>
						<input
							type="text"
							class="form-control"
							id="last-name"
							placeholder="Other name"
							required
						/>
					</div>
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">Email address</label>
					<input
						type="email"
						class="form-control"
						id="email"
						placeholder="Enter your email address"
						required
					/>
				</div>
				<div class="mb-3">
					<label for="phone" class="form-label">Mobile Num</label>
					<input
						type="number"
						id="phone"
						class="form-control"
						placeholder="Mobile Number"
						required
					/>
				</div>
				<div class="d-flex justify-content-between gap-3">
					<div class="mb-3">
						<label for="gender" class="form-label">Sex</label>
						<input
							type="text"
							class="form-control"
							placeholder="Male or Female"
						/>
					</div>
					<div class="mb-">
						<label for="age" class="form-label">Age</label>
						<input
							type="date"
							name="age"
							id="age"
							placeholder=""
							class="form-control"
						/>
					</div>
				</div>
				<div class="mb-3">
					<label for="address" class="form-label">Address</label>
					<input
						type="text"
						name="address"
						id="address"
						placeholder="Enter your address"
						class="form-control"
					/>
				</div>
				<div class="mb-3">
					<label for="password" class="form-label">Password</label>
					<input type="password" class="form-control" id="password" />
				</div>

				<div
					class="d-flex justify-content-between justify-content-md-center align-items-center w-100"
				>
					<button type="submit" class="btn btn-success btn-large submit-btn">
						Submit
					</button>
					<a href="./index.html" class="btn btn-light btn-large back-btn">
						<i class="bi bi-arrow-left"></i> Go back</a
					>
				</div>
			</form>
		</div>
	</body>
</html>
